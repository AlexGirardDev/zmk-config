# The settings_reset shield turns battery reporting off, but the adv360pro board
# defconfig leaves RGB underglow on, and this ZMK fork's battery underglow effect
# (rgb_underglow.c, zmk_rgb_underglow_effect_battery) calls
# zmk_battery_state_of_charge unconditionally -- so the reset image fails to link
# for both halves. The reset firmware has no use for lighting anyway.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n
