# The dongle (config/boards/shields/adv360pro_dongle) is the split central, so
# the left half runs as a peripheral like the right one.
#
# To go back to a dongle-free keyboard for travel, flip this to y, rebuild, and
# settings-reset both halves before flashing. See docs/dongle.md.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# A peripheral cannot talk USB to a host, and the board defconfig turns it on
# unconditionally. Setting it explicitly keeps the build log free of an
# unsatisfiable-dependency warning. Flashing still works via the bootloader.
CONFIG_ZMK_USB=n
