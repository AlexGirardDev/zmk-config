# Dongle central for the Adv360 Pro (Seeed XIAO nRF52840).
#
# config/adv360pro.conf is applied to this build too -- ZMK derives the
# candidate name "adv360pro" from the shield name "adv360pro_dongle" -- so the
# mouse, combo and BLE tuning settings are inherited and only the dongle
# specific bits belong here.

# Two peripherals (left + right) plus five host profiles.
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# Match the HID behaviour the halves ship with, so the host sees the same
# keyboard it did when the left half was wired up.
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# If the KVM ever fails to see the keyboard in BIOS/UEFI or right after a
# switch, turn this on first -- it adds the HID boot protocol interface.
# CONFIG_ZMK_USB_BOOT=y

# USB powered, no keys and no battery of its own.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_BATTERY_REPORTING=n

# Combo config, automated by build script
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=5
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=3
